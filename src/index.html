<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="./style.css?v=19">

<canvas id="wave-grid" aria-hidden="true"></canvas>
<button class="site-brand" type="button" aria-label="Andrew's Car Wash: borrar el formulario y volver a cargar">
  <svg class="site-brand__car" viewBox="0 0 64 40" fill="none" aria-hidden="true">
    <path d="M8 25h48l-3.5-9a6 6 0 0 0-5.6-3.8H25a8 8 0 0 0-6.4 3.2L14 21H9a3 3 0 0 0-3 3v4h5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M22 29h21m10 0h3v-4M18.5 16.3 15 21h18v-8h-8a6 6 0 0 0-4.8 2.3ZM36 13v8h14.8l-1.6-4.2a5.8 5.8 0 0 0-5.4-3.8H36Z" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="17" cy="28" r="4" fill="currentColor" />
    <circle cx="47" cy="28" r="4" fill="currentColor" />
    <circle cx="17" cy="28" r="1.5" fill="var(--surface)" />
    <circle cx="47" cy="28" r="1.5" fill="var(--surface)" />
  </svg>
  <span class="site-brand__name">
    <span>ANDREW´S</span>
    <span>CAR WASH</span>
  </span>
</button>

<main>
  <div id="img">
    <img src="https://img.freepik.com/free-vector/car-wash-concept-illustration_114360-6875.jpg?w=740&t=st=1676885127~exp=1676885727~hmac=0c363f88c0047367a628dc6ea196cdaf1e466366e5eb539f9c9a02262ed08ac2" alt="Ilustración de un lavado de autos">
  </div>

  <form id="bookCar">
    <h1>RESERVA UN LAVADO DE AUTO</h1>
    <!-- Select vehicle type -->
    <fieldset id="vehicle" class="select">
      <legend>Selecciona el tipo de vehículo</legend>
      <div class="container">
        <input type="radio" id="myCheckbox1" name="vehicle-type" value="Regular_size">
        <label for="myCheckbox1">
          <img src="https://cdn-icons-png.flaticon.com/512/3097/3097136.png" alt="Auto de tamaño estándar">
          <h3>Tamaño estándar</h3>
        </label>
        <input type="radio" id="myCheckbox2" name="vehicle-type" value="Minivan">
        <label for="myCheckbox2">
          <img src="https://cdn-icons-png.flaticon.com/512/4502/4502434.png" alt="Miniván">
          <h3>Miniván</h3>
        </label>

        <input type="radio" id="myCheckbox3" name="vehicle-type" value="Pickup_truck">
        <label for="myCheckbox3">
          <img src="https://cdn-icons-png.flaticon.com/512/4502/4502386.png" alt="Camioneta pickup">
          <h3>Camioneta pickup</h3>
        </label>

        <input type="radio" id="myCheckbox4" name="vehicle-type" value="Cargo_truck">
        <label for="myCheckbox4">
          <img src="https://cdn-icons-png.flaticon.com/512/4502/4502429.png" alt="Camión de carga">
          <h3>Camión de carga</h3>
        </label>
      </div>
    </fieldset>

    <!-- Select wash packages -->

    <fieldset id="packages" class="select">
      <legend>Selecciona el tipo de lavado</legend>
      <div class="container" id="wash">
        <input type="radio" id="myCheckbox5" name="wash_packages" value="Tunnel wash">
        <label for="myCheckbox5">
          <img src="https://cdn-icons-png.flaticon.com/512/1743/1743703.png" alt="Lavado en túnel">
          <h3>Lavado en túnel</h3>
        </label>
        <input type="radio" id="myCheckbox6" name="wash_packages" value="Self wash">
        <label for="myCheckbox6">
          <img src="https://cdn-icons-png.flaticon.com/512/5102/5102957.png" alt="Lavado autoservicio">
          <h3>Lavado autoservicio</h3>
        </label>

        <input type="radio" id="myCheckbox7" name="wash_packages" value="Chemical wash">
        <label for="myCheckbox7">
          <img src="https://cdn-icons-png.flaticon.com/512/2946/2946633.png" alt="Lavado con productos químicos">
          <h3>Lavado con productos químicos</h3>
        </label>

        <input type="radio" id="myCheckbox8" name="wash_packages" value="Hand wash">
        <label for="myCheckbox8">
          <img src="https://cdn-icons-png.flaticon.com/512/2052/2052391.png" alt="Lavado a mano">
          <h3>Lavado a mano</h3>
        </label>
      </div>
    </fieldset>
    <!-- customer data-->

    <fieldset id="customer">
      <div class="data">
        <label for="name">Tu nombre:</label>
        <input type="text" name="Name" id="name" placeholder="Tu nombre" required>
      </div>
      <div class="data">
        <label for="email">Tu correo electrónico:</label>
        <input type="email" name="email" id="email" placeholder="correo@ejemplo.com" required>
      </div>
      <div class="data">
        <label for="city">Nombre de tu ciudad</label>
        <input type="text" name="city" id="city" placeholder="Nombre de tu ciudad" required>
      </div>
      <div class="data">
        <label for="date">Selecciona una fecha</label>
        <input type="date" name="date" id="date" required>
      </div>
      <div class="data">
        <label for="textarea">Mensaje adicional</label>
        <textarea name="massage" id="textarea"></textarea>
      </div>

    </fieldset>
    <button type="submit" data-liquid-button>Reservar cita</button>

  </form>
</main>
